version: "3.8"

services:

  app:
    build: .
    container_name: healthcare_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/healthcare_db_Ayoub?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: AyoubHadi120

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: mysql_db_v2
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: healthcare_db_Ayoub
      MYSQL_ROOT_PASSWORD: AyoubHadi120
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pAyoubHadi120"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    container_name: healthcare_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: healthcare_redisinsight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data: